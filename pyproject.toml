[project]
name = "hyper-harness"
version = "0.1.0"
description = "Hello World FastAPI backend for the hyper-productivity agent harness template"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "import-linter>=2.15",
    "pip-audit>=2.10.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
# E/W/F: pycodestyle + pyflakes, I: imports, B: bugbear, UP: pyupgrade, S: bandit security,
# SIM: simplify, N: naming, RUF: ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.pyright]
include = ["backend"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.importlinter]
root_package = "backend"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api -> services -> domain"
type = "layers"
layers = ["backend.main", "backend.api", "backend.services", "backend.domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure: no web framework or HTTP"
type = "forbidden"
source_modules = ["backend.domain", "backend.services"]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]
